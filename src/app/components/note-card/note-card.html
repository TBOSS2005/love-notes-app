<div 
  (click)="onToggle()"
  class="relative cursor-pointer transition-transform duration-100 hover:-translate-y-1 bg-fuchsia-900 border-4 border-pink-400 p-4 shadow-[6px_6px_0px_#500724] group"
>
  <!-- Window Header -->
  <div class="bg-pink-400 text-fuchsia-950 font-pixel text-[10px] px-2 py-1 mb-3 flex justify-between items-center">
    <span class="uppercase tracking-wider font-bold">
      [{{ note.category }}]
    </span>
    <span class="text-base" *ngIf="note.moodEmoji">{{ note.moodEmoji }}</span>
  </div>

  <!-- Note Title -->
  <h3 class="font-pixel text-sm text-pink-200 mb-3 group-hover:text-cyan-300 transition-colors">
    {{ note.title }}
  </h3>

  <!-- Content / Sealed State -->
  <div *ngIf="note.isOpened; else sealedState" class="space-y-3 font-terminal text-lg">
    <p class="text-pink-100 leading-snug whitespace-pre-line bg-fuchsia-950 p-3 border-2 border-pink-500/50">
      {{ note.content }}
    </p>
    <div class="pt-2 border-t-2 border-pink-800 flex justify-between items-center text-xs text-pink-400 font-pixel">
      <span>FROM: <strong class="text-pink-200">{{ note.sender }}</strong></span>
      <span>{{ note.date | date:'mediumDate' }}</span>
    </div>
  </div>

  <ng-template #sealedState>
    <div class="py-6 text-center bg-fuchsia-950 border-2 border-dashed border-pink-500 my-2">
      <p class="text-3xl mb-2 animate-bounce">💌</p>
      <p class="font-pixel text-[10px] text-cyan-300 uppercase">Press to Decrypt Note</p>
    </div>
  </ng-template>

  <!-- Actions -->
  <div class="mt-3 flex justify-end">
    <button 
      (click)="onDelete($event)" 
      class="opacity-0 group-hover:opacity-100 transition-opacity font-pixel text-[10px] text-rose-300 hover:text-white bg-rose-900 border-2 border-rose-400 px-2 py-1"
    >
      [DELETE]
    </button>
  </div>
</div>
