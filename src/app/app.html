<div class="min-h-screen scanlines py-10 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-8 bg-fuchsia-900/90 border-4 border-pink-400 p-6 shadow-[8px_8px_0px_#500724]">
      <h1 class="font-pixel text-2xl sm:text-4xl text-pink-300 drop-shadow-[2px_2px_0px_#f472b6] mb-3">
        LOVE_SIMULATOR_2000
      </h1>
      <p class="font-terminal text-xl text-pink-200">
        A private digital memory archive for Player 1 & Player 2.
      </p>
    </header>

    <!-- Countdown Timer Component -->
    <app-countdown></app-countdown>

    <!-- New Note Form Component -->
    <app-note-form (addNote)="handleAddNote($event)"></app-note-form>

    <!-- Category Filters -->
    <div class="flex justify-center flex-wrap gap-2 mb-8 font-pixel text-[10px]">
      <button 
        *ngFor="let cat of ['all', 'sweet', 'funny', 'memories', 'future']"
        (click)="setCategory(cat)"
        [class.bg-pink-400]="selectedCategory === cat"
        [class.text-fuchsia-950]="selectedCategory === cat"
        [class.bg-fuchsia-950]="selectedCategory !== cat"
        [class.text-pink-300]="selectedCategory !== cat"
        class="px-3 py-2 border-2 border-pink-400 uppercase tracking-wider hover:border-cyan-300"
      >
        [{{ cat }}]
      </button>
    </div>

    <!-- Notes Grid -->
    <div *ngIf="filteredNotes.length > 0; else emptyState" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <app-note-card 
        *ngFor="let note of filteredNotes" 
        [note]="note"
        (delete)="handleDeleteNote($event)"
        (toggleOpen)="handleToggleOpen($event)"
      >
      </app-note-card>
    </div>

    <ng-template #emptyState>
      <div class="text-center py-12 bg-fuchsia-900 border-4 border-pink-400 max-w-md mx-auto shadow-[6px_6px_0px_#500724]">
        <p class="text-4xl mb-2">👾</p>
        <p class="font-pixel text-xs text-pink-200">NO_DATA_FOUND</p>
        <p class="font-terminal text-lg text-pink-400 mt-2">Initialize a new memory note above!</p>
      </div>
    </ng-template>
  </div>
</div>
